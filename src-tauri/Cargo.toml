[package]
name = "courseshelf"
version = "0.3.0"
description = "Track your progress through local video courses"
authors = ["Khaled"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "courseshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tiny_http = { version = "0.12", default-features = false }
percent-encoding = "2"
subtle = "2"
# OS-backed secure randomness on Linux and Windows; already present transitively.
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used transitively by Tauri; read actual GDK state rather than Tao's cached request.
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
